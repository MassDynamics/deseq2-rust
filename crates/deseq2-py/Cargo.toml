[package]
name = "deseq2-py"
description = "PyO3 bindings for deseq2-core and shrink-core, built with maturin into `deseq2_rust._core`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
deseq2-core = { path = "../deseq2-core" }
shrink-core = { path = "../shrink-core" }
edger-core = { workspace = true }
rnum = { workspace = true }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"] }
numpy = "0.24"
