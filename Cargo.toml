[workspace]
resolver = "2"
members = ["crates/deseq2-core", "crates/shrink-core", "crates/deseq2-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2"
# edge-rust pinned to a recorded commit (review r1, D-1): an edge-rust change can no longer
# break this build silently. Bump the rev deliberately and re-run the gate.
rnum = { git = "ssh://git@github.com/MassDynamics/edge-rust.git", rev = "003868bdfdb03f8d963b21114e7769b76fb0d8b8" }
edger-core = { git = "ssh://git@github.com/MassDynamics/edge-rust.git", rev = "003868bdfdb03f8d963b21114e7769b76fb0d8b8" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
