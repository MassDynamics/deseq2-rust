[workspace]
resolver = "2"
members = ["crates/deseq2-core", "crates/shrink-core", "crates/deseq2-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2"
# edge-rust pinned to a recorded commit (review r1, D-1): an edge-rust change can no longer
# break this build silently. Bump the rev deliberately and re-run the gate.
rnum = { git = "file:///Users/giuseppeinfusini/wd/md-repos/edge-rust", rev = "dc7bfd609b2e1d69c9d4fdf69b2b9755c3e50558" }
edger-core = { git = "file:///Users/giuseppeinfusini/wd/md-repos/edge-rust", rev = "dc7bfd609b2e1d69c9d4fdf69b2b9755c3e50558" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
