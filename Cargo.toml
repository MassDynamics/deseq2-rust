[workspace]
resolver = "2"
members = ["crates/deseq2-core", "crates/shrink-core", "crates/deseq2-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2"
rnum = { path = "../edge-rust/crates/rnum" }
edger-core = { path = "../edge-rust/crates/edger-core" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
